name: Apple (iOS / iPadOS / macOS)

on:
  push:
    branches: ["**"]
    paths: ["apple/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/apple.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: 選用最新的 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 核心套件單元測試
        working-directory: apple/Packages/TapSayKit
        run: swift test

      - name: 產生 Xcode 專案
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 建置 macOS（ad-hoc 簽章）
        working-directory: apple
        run: |
          xcodebuild -project TapSay.xcodeproj -scheme TapSay-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -quiet build

      - name: 建置 iOS / iPadOS（不簽章，只驗證能編譯）
        working-directory: apple
        run: |
          xcodebuild -project TapSay.xcodeproj -scheme TapSay-iOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build

      - name: 打包 macOS App
        run: |
          APP=apple/build/Build/Products/Release/TapSay.app
          codesign -dv "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" TapSay-Swift-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: TapSay-Swift-macOS
          path: TapSay-Swift-macOS.zip
